<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A searchable product explorer powered by DummyJSON." />
    <title>Object Index - Product Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <a class="wordmark" href="./" aria-label="Object Index home">OBJECT<br />INDEX<span>™</span></a>
        <p class="edition">PRODUCT ARCHIVE<br />VOL. 01 / 2026</p>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">A FIELD GUIDE TO THINGS</p>
        <h1 id="page-title">Find something<br /><em>worth noticing.</em></h1>
        <form class="search-form" role="search">
          <label class="sr-only" for="search">Search the product archive</label>
          <input id="search" name="q" type="search" placeholder="Search the archive..." autocomplete="off" />
          <button type="submit">Search <span aria-hidden="true">↗</span></button>
        </form>
      </section>

      <section class="catalogue" aria-live="polite" aria-busy="true">
        <div class="catalogue-bar">
          <p id="result-summary">Opening the archive…</p>
          <p id="page-label">PAGE —</p>
        </div>
        <div id="message" class="message" hidden></div>
        <button id="retry" class="retry" type="button" hidden>Try again</button>
        <div id="products" class="product-grid" aria-label="Products"></div>
      </section>

      <nav class="pager" aria-label="Pagination">
        <button id="previous" type="button" disabled>← Previous</button>
        <p id="page-status">Page — of —</p>
        <button id="next" type="button" disabled>Next →</button>
      </nav>
    </main>

    <template id="product-card-template">
      <article class="product-card">
        <div class="image-wrap">
          <img class="product-image" alt="" />
          <span class="item-number"></span>
        </div>
        <div class="card-copy">
          <h2 class="product-title"></h2>
          <div class="product-meta"><span class="product-price"></span><span class="product-rating"></span></div>
        </div>
      </article>
    </template>

    <script type="module" src="app.js"></script>
  </body>
</html>
